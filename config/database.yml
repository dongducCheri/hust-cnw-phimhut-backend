default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("POSTGRES_USER") { "postgres" } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { "123456" } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "127.0.0.1" } %>
  port: 5432

development:
  <<: *default
  database: phimhut_backend_development

test:
  <<: *default
  database: phimhut_backend_test

production:
  primary: &primary_production
    <<: *default
    database: phimhut_backend_production
    username: phimhut_backend
    password: <%= ENV["PHIMHUT_BACKEND_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: phimhut_backend_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: phimhut_backend_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: phimhut_backend_production_cable
    migrations_paths: db/cable_migrate